# docker-compose.yml
version: '3.8'
services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/arcadehaven
      - SPRING_DATASOURCE_USERNAME=arcadehaven
      - SPRING_DATASOURCE_PASSWORD=secret
      - JWT_SECRET=supersecretkey
      - STORAGE_PATH=/app/storage
    volumes:
      - ./storage:/app/storage
    depends_on:
      - db

  db:
    image: postgres:15
    environment:
      - POSTGRES_DB=arcadehaven
      - POSTGRES_USER=arcadehaven
      - POSTGRES_PASSWORD=secret
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
  postgres_data: