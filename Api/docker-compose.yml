# docker-compose.yml
version: '3.8'
services:

  # V12.2.1 — All client connections go through nginx (TLS); HTTP :80 → HTTPS :443.
  # V12.1.1 — ssl_protocols TLSv1.2 TLSv1.3 (see nginx/nginx.conf)
  # V12.1.2 — ECDHE+GCM cipher suites only (see nginx/nginx.conf)
  # V12.2.2 — mount a CA-signed cert in production (currently self-signed for dev/CI)
  # Generate the self-signed dev cert once with: ./nginx/generate-self-signed-cert.sh
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    networks:
      - app-services
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

  app:
    image: arcadehaven-api:latest
    build:
      context: .
      dockerfile: Dockerfile
    # Port 8080 is intentionally NOT published externally — all traffic enters
    # via nginx (port 443). Remove the comment below and the ports block when
    # deploying to production; keep it only for local debugging.
    # ports:
    #   - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      KEYCLOAK_JWK_SET_URI: ${KEYCLOAK_JWK_SET_URI}
      KEYCLOAK_JWK_ISSUER: ${KEYCLOAK_JWK_ISSUER}
      KEYCLOAK_SERVER_URL: ${KEYCLOAK_SERVER_URL}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID}
      KEYCLOAK_BACKEND_CLIENT_SECRET: ${KEYCLOAK_BACKEND_CLIENT_SECRET}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      SFTP_HOST: ${SFTP_HOST}
      SFTP_PORT: ${SFTP_PORT}
      SFTP_USERNAME: ${SFTP_USERNAME}
      SFTP_PASSWORD: ${SFTP_PASSWORD}
      SFTP_REMOTE_DIR: ${SFTP_REMOTE_DIR}
      CLAMAV_HOST: ${CLAMAV_HOST}
      CLAMAV_PORT: ${CLAMAV_PORT}
      CLAMAV_TIMEOUT_MS: ${CLAMAV_TIMEOUT_MS}
      # TLS terminated at the reverse proxy; disable Spring Boot SSL to avoid missing-keystore error
      SERVER_SSL_ENABLED: "false"
      # V12.3.1 / V14.2.4 — DB TLS mode: 'prefer' (dev) or 'require' (production with TLS-enabled DB)
      DB_SSL_MODE: ${DB_SSL_MODE:-prefer}
      # V13.2.2 — Set FLYWAY_DATASOURCE_URL / _USERNAME / _PASSWORD in .env to use a separate
      # DDL-only user for Flyway migrations. When not set, Flyway falls back to the main datasource.
      # RF-12 — RAWG API key for game metadata enrichment. Set RAWG_API_KEY in .env.
      # V13.2.4 — permitted egress: Keycloak, PostgreSQL (vsgate-s1.dei.isep.ipp.pt:10345),
      #   SFTP, HIBP (api.pwnedpasswords.com), RAWG (api.rawg.io). All hardcoded in code.
      RAWG_API_KEY: ${RAWG_API_KEY:-}
    volumes:
      - ./storage:/app/storage
    networks:
      - app-services   # reaches keycloak; nginx reaches app on this network
    # RNF-26 — restart on crash; healthcheck via Spring Boot Actuator
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 120s
    depends_on:
      keycloak:
        condition: service_healthy
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.2
    command: start-dev --import-realm
    ports:
      - "8180:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: ${KC_DB}
      KC_DB_URL: ${KC_DB_URL}
      KC_DB_USERNAME: ${KC_DB_USERNAME}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD}
      KC_HOSTNAME_STRICT: ${KC_HOSTNAME_STRICT}
      KC_HTTP_ENABLED: ${KC_HTTP_ENABLED}
      KC_HEALTH_ENABLED: ${KC_HEALTH_ENABLED}
    volumes:
      - ../keycloak:/opt/keycloak/data/import
    networks:
      - keycloak-internal   # reaches keycloak-db
      - app-services        # reachable by app for JWT verification and admin API
    # RNF-26 — management interface is on port 9000; no curl in the image, use /dev/tcp
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && printf 'GET /health/ready HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 240s
    depends_on:
      keycloak-db:
        condition: service_healthy
    restart: unless-stopped

  keycloak-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - keycloak_db_data:/var/lib/postgresql/data
    networks:
      - keycloak-internal   # V1.3.6 — isolated: no internet, not reachable by app directly
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # RNF-27 — Daily pg_dump for both the remote application DB and the local Keycloak DB.
  # Runs at 02:00 every day (see backup/crontab). Backups are stored in ./backups/ on the host.
  # To trigger immediately: docker compose exec backup sh /backup.sh
  backup:
    image: postgres:16-alpine
    environment:
      # Remote application database
      REMOTE_HOST: vsgate-s1.dei.isep.ipp.pt
      REMOTE_PORT: "10345"
      REMOTE_USER: ${SPRING_DATASOURCE_USERNAME}
      REMOTE_DB_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      # Database name: update if the remote DB is not named 'postgres'
      REMOTE_DB: postgres
      # Local Keycloak database
      KC_DB_PASSWORD: ${KC_DB_PASSWORD}
      # Days to retain backups (default: 7)
      RETENTION_DAYS: "7"
    volumes:
      - ./backups:/backups
      - ./backup/backup.sh:/backup.sh:ro
      - ./backup/crontab:/etc/crontabs/root:ro
    networks:
      - keycloak-internal   # reaches keycloak-db for local pg_dump
      - app-services        # internet access for remote DB at vsgate-s1.dei.isep.ipp.pt
    # Use sh explicitly — avoids needing execute bit on the mounted script
    command: ["/bin/sh", "-c", "crond -f -l 2"]
    depends_on:
      keycloak-db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  storage_data:
  keycloak_db_data:

# V1.3.6 — Docker network isolation as an egress allowlist enforcement layer.
# keycloak-internal: internal=true isolates keycloak-db from the internet and from the
#   app container — keycloak-db is only reachable by keycloak and backup.
# app-services: shared bridge for nginx ↔ app ↔ keycloak communication; allows internet
#   egress for app (HIBP, RAWG, SFTP, remote DB) and backup (remote DB pg_dump).
networks:
  keycloak-internal:
    internal: true
  app-services: {}