# =============================================================
# ArcadeHaven — nginx TLS reverse proxy
#
# ASVS V12.1.1  ssl_protocols TLSv1.2 TLSv1.3 only
# ASVS V12.1.2  ECDHE+GCM cipher suites; RC4/3DES/CBC excluded
# ASVS V12.2.1  HTTP :80 → HTTPS :443; no plaintext API fallback
# ASVS V12.2.2  ssl_certificate / ssl_certificate_key — replace
#               self-signed cert with a CA-signed cert in production
# ASVS V4.1.3   nginx overwrites X-Forwarded-For with $remote_addr
#               so clients cannot inject a spoofed IP
# =============================================================

events {
    worker_connections 1024;
}

http {

    # ── V12.2.1: redirect every HTTP request to HTTPS ────────────────────────
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # ── TLS termination ───────────────────────────────────────────────────────
    server {
        listen 443 ssl;
        server_name _;

        # V12.2.2 — certificate paths.
        # Dev/CI:    generate with  ./nginx/generate-self-signed-cert.sh
        # Production: replace with a certificate from Let's Encrypt or an
        #             institutional CA (edit paths below).
        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;

        # V12.1.1 — only TLS 1.2 and 1.3; SSLv2/3 and TLS 1.0/1.1 excluded
        ssl_protocols TLSv1.2 TLSv1.3;

        # V12.1.2 — ECDHE cipher suites with AES-GCM (forward secrecy + AEAD)
        #           RC4, 3DES, and non-AEAD CBC suites are excluded
        ssl_ciphers ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
        ssl_prefer_server_ciphers on;

        # Enable TLS session tickets for performance (keys rotated per session)
        ssl_session_timeout 1d;
        ssl_session_cache   shared:SSL:10m;

        # HSTS (V3.4.1 — also enforced by Spring Security on every response)
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # V4.1.3 — nginx is the only trusted proxy; overwrite (not append)
        # X-Forwarded-For so end-users cannot inject a spoofed client IP.
        # Tomcat's RemoteIpFilter (server.forward-headers-strategy=NATIVE) then
        # accepts only headers from trusted RFC-1918 ranges (Docker network).
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host              $host;

        location / {
            proxy_pass         http://app:8080;
            proxy_read_timeout 60s;
            proxy_connect_timeout 10s;

            # Do not let the upstream override the security headers set above
            proxy_hide_header X-Powered-By;
        }
    }
}
