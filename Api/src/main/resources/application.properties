spring.application.name=arcadehaven

# ===============================
# DATASOURCE
# ===============================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://vsgate-s1.dei.isep.ipp.pt:10345/}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:LQ4QGqhh8gtS}
spring.datasource.driver-class-name=org.postgresql.Driver

# ==============================
# JPA / HIBERNATE
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.open-in-view=false

# ===============================
# FLYWAY
# ===============================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# ===============================
# JWT
# ===============================
jwt.secret=${JWT_SECRET:3f8a2b1c9d4e7f6a0b5c8d2e3f1a4b7c9d0e5f8a2b3c4d5e6f7a8b9c0d1e2f3}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ===============================
# FILE STORAGE
# ===============================
storage.path=${STORAGE_PATH:storage}

# ===============================
# DEFAULT ADMIN (created on first startup)
# ===============================
admin.default.username=${ADMIN_USERNAME:admin}
admin.default.email=${ADMIN_EMAIL:admin@arcadehaven.com}
admin.default.password=${ADMIN_PASSWORD:Admin123!}

# ===============================
# LOGGING
# ===============================
logging.level.isep.desosfs.arcadehaven=INFO
logging.level.org.springframework.security=WARN

# ===============================
# JACKSON
# ===============================
spring.jackson.mapper.accept-case-insensitive-enums=true
