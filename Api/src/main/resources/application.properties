spring.application.name=arcadehaven

# ===============================
# DATASOURCE
# ===============================
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
# V12.3.1 — for production, append ?sslmode=require to SPRING_DATASOURCE_URL
# once the remote PostgreSQL server has TLS enabled.
# Example: jdbc:postgresql://host:5432/db?sslmode=require&sslrootcert=/path/to/ca.crt

# ==============================
# JPA / HIBERNATE
# ===============================
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.open-in-view=false

# ===============================
# FLYWAY
# ===============================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=false
spring.flyway.mixed=true
# V13.2.2 — DDL/DML user separation: set FLYWAY_DATASOURCE_* in production to a DDL-only
# PostgreSQL user. Falls back to the main datasource credentials in dev/CI (no behaviour change).
spring.flyway.url=${FLYWAY_DATASOURCE_URL:${spring.datasource.url}}
spring.flyway.user=${FLYWAY_DATASOURCE_USERNAME:${spring.datasource.username}}
spring.flyway.password=${FLYWAY_DATASOURCE_PASSWORD:${spring.datasource.password}}

# ===============================
# KEYCLOAK — OAuth2 Resource Server
# ===============================
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWK_SET_URI:http://localhost:8080/realms/arcadehaven/protocol/openid-connect/certs}
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_JWK_ISSUER:http://localhost:8080/realms/arcadehaven}
# ASVS V9.2.3/V9.2.4 — aud claim must contain this value; prevents audience confusion attacks
spring.security.oauth2.resourceserver.jwt.audiences=arcadehaven-api

# ===============================
# KEYCLOAK — Admin Client
# ===============================
keycloak.server-url=${KEYCLOAK_SERVER_URL:http://keycloak:8080}
keycloak.realm=${KEYCLOAK_REALM:arcadehaven}
keycloak.client-id=${KEYCLOAK_CLIENT_ID:arcadehaven-public}
# Service-account client used for Keycloak Admin API (V10.4.10 — client_credentials, not password grant)

keycloak.admin.client-id=${KEYCLOAK_ADMIN_CLIENT_ID:arcadehaven-backend}
keycloak.admin.client-secret=${KEYCLOAK_BACKEND_CLIENT_SECRET}

# ===============================
# FILE STORAGE
# ===============================
# storage.backend: "sftp" (default, production) | "local" (dev / CI without SFTP)
storage.backend=${STORAGE_BACKEND:sftp}
storage.path=${STORAGE_PATH:storage}

# ===============================
# DEFAULT ADMIN (local DB profile — Keycloak manages auth)
# ===============================
admin.default.username=${ADMIN_USERNAME}
admin.default.email=${ADMIN_EMAIL}
admin.default.password=${ADMIN_PASSWORD}

# ===============================
# LOGGING
# ===============================
logging.level.isep.desosfs.arcadehaven=INFO
logging.level.org.springframework.security=WARN
logging.level.org.flywaydb=INFO
# SECURITY_AUDIT level is set to INFO in logback-spring.xml (named logger with dedicated appenders).
# Do not add logging.level.SECURITY_AUDIT here — it would override the XML config and suppress
# LOGIN_SUCCESS / REGISTRATION_SUCCESS events required by ASVS V16.3.1.

# Audit events go to a dedicated file for easy scraping / alerting
logging.file.name=logs/arcadehaven.log
logging.logback.rollingpolicy.max-history=30

# ===============================
# TLS (ASVS V4.1.2 / ASVS V12.1.1 / V12.1.2)
# ===============================
# Restricts TLS to 1.2 and 1.3 only when server.ssl.enabled=true.
# When TLS is terminated by a reverse proxy, apply equivalent restrictions there:
#   nginx: ssl_protocols TLSv1.2 TLSv1.3; ssl_ciphers ECDHE-ECDSA-AES256-GCM-SHA384:...;
server.ssl.enabled-protocols=TLSv1.2,TLSv1.3
# Forward-secrecy (ECDHE) cipher suites only — active when server.ssl.enabled=true (V12.1.2)
server.ssl.ciphers=TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384,TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256,TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384,TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256

# ===============================
# CORS (ASVS V3.4.2)
# ===============================
# Comma-separated list of trusted frontend origins. Override with CORS_ALLOWED_ORIGINS env var.
security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# ===============================
# PASSWORD POLICY
# ===============================
# Set to false to skip the HIBP breach check (e.g. in CI without outbound internet)
security.hibp.enabled=true

# ===============================
# JACKSON (ASVS V1.5.2)
# ===============================
spring.jackson.mapper.accept-case-insensitive-enums=true
# Reject unknown properties to prevent mass-assignment attacks; enableDefaultTyping is NOT active
spring.jackson.deserialization.fail-on-unknown-properties=true

# ===============================
# TOMCAT THREAD POOL (RNF-24 — 100+ concurrent users)
# ===============================
server.tomcat.threads.max=200
server.tomcat.threads.min-spare=20
server.tomcat.connection-timeout=20000

# ===============================
# HIKARICP CONNECTION POOL (RNF-24)
# ===============================
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
# V12.3.1 / V14.2.4 — TLS mode for the PostgreSQL connection.
# 'prefer' negotiates TLS when available; change DB_SSL_MODE=require once the remote DB has TLS.
spring.datasource.hikari.data-source-properties.sslmode=${DB_SSL_MODE:prefer}

# ===============================
# FILE UPLOAD LIMITS
# ===============================
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

# SFTP CONFIGURATION
sftp.host=${SFTP_HOST}
sftp.port=${SFTP_PORT}
sftp.username=${SFTP_USERNAME}
sftp.password=${SFTP_PASSWORD}
sftp.remote-dir=${SFTP_REMOTE_DIR}
# ASVS V12.3.4 — path to SSH known_hosts file for strict host-key verification.
# Leave blank to use PromiscuousVerifier (dev/CI only — never blank in production).
# Generate with: ssh-keyscan -p <port> <host> >> /path/to/known_hosts
sftp.known-hosts-path=${SFTP_KNOWN_HOSTS_PATH:}

# ClamAV Configuration
clamav.host=${CLAMAV_HOST}
clamav.port=${CLAMAV_PORT}
clamav.timeout-ms=${CLAMAV_TIMEOUT_MS}

# ===============================
# REVERSE PROXY / FORWARDED HEADERS (ASVS V4.1.4 / ASVS V15.3.4)
# ===============================
# NATIVE delegates X-Forwarded-For resolution to Tomcat's built-in RemoteIpFilter.
# Only headers arriving from trusted-proxies (RFC-1918 ranges used by Docker networks)
# are accepted; any X-Forwarded-For header supplied by an end-user connecting directly
# is stripped before the application reads request.getRemoteAddr().
server.forward-headers-strategy=NATIVE
server.tomcat.remoteip.remote-ip-header=X-Forwarded-For
server.tomcat.remoteip.protocol-header=X-Forwarded-Proto
server.tomcat.remoteip.trusted-proxies=10\\.\\d{1,3}\\.\\d{1,3}\\.\\d{1,3}|172\\.(1[6-9]|2\\d|3[0-1])\\.\\d{1,3}\\.\\d{1,3}|192\\.168\\.\\d{1,3}\\.\\d{1,3}|127\\.0\\.0\\.1

# ===============================
# RAWG API (RF-12 — game data enrichment)
# ===============================
# Set RAWG_API_KEY in .env. Leave blank to disable enrichment (dev/CI without internet).
rawg.api.key=${RAWG_API_KEY:}

# ===============================
# SPRING BOOT ACTUATOR (ASVS V13.4.5 / V15.2.3)
# ===============================
# Expose only the health endpoint; hide all internal details in production
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
