name: Secret Scanning

on:
  push:
    branches: [ main ]

  pull_request:
    branches: [ main ]

  workflow_dispatch:

# Permissions to read repository
permissions:
  contents: read

jobs:
  secret-scan:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest

    steps:
      # Gets repository from github
      - name: Checkout repository
        uses: actions/checkout@v5

      # Runs Gitleaks to verify for secrets/keys leaks in current files
      - name: Run Gitleaks
        uses: docker://zricethezav/gitleaks:latest
        with:
          args: dir --source=. --verbose --redact