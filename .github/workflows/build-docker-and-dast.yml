name: Docker Build, Scan & DAST # Dynamic Application Security Testing (DAST)

on:
  push:
    branches: [ main, pipeline ]

  pull_request:
    branches: [ main, pipeline ]

permissions:
  contents: read
  security-events: write
  actions: read

jobs:

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Api

    env:
      SPRING_DATASOURCE_URL: ${{ vars.SPRING_DATASOURCE_URL }}
      SPRING_DATASOURCE_USERNAME: ${{ secrets.SPRING_DATASOURCE_USERNAME }}
      SPRING_DATASOURCE_PASSWORD: ${{ secrets.SPRING_DATASOURCE_PASSWORD }}

      KEYCLOAK_SERVER_URL: ${{ vars.KEYCLOAK_SERVER_URL }}
      KEYCLOAK_REALM: ${{ secrets.KEYCLOAK_REALM }}
      KEYCLOAK_ADMIN_USERNAME: ${{ secrets.KEYCLOAK_ADMIN_USERNAME }}
      KEYCLOAK_ADMIN_PASSWORD: ${{ secrets.KEYCLOAK_ADMIN_PASSWORD }}

      ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
      ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}

      SFTP_HOST: ${{ vars.SFTP_HOST }}
      SFTP_PORT: ${{ vars.SFTP_PORT }}
      SFTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
      SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
      SFTP_REMOTE_DIR: ${{ vars.SFTP_REMOTE_DIR }}

      KC_DB: ${{ vars.KC_DB }}
      KC_DB_URL: ${{ vars.KC_DB_URL }}
      KC_DB_USERNAME: ${{ secrets.POSTGRES_USER }}
      KC_DB_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}

      POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
      POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}

    steps:
      # Checkout repository
      - name: Checkout
        uses: actions/checkout@v5

      # Set up Docker Buildx
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build Docker image
      - name: Build images
        run: docker compose build

      # Start containers
      - name: Start Docker containers
        run: docker compose up -d

      # Application health check
      - name: Wait for app
        run: |
          for i in {1..60}; do
            if curl -fs http://localhost:8080/actuator/health; then
              echo "App ready"
              exit 0
            fi
          
            echo $i ": Waiting for app..."
            sleep 5
          done
          
          echo "App failed to start"
          docker compose logs
          
          exit 1

      - name: Stop Docker containers
        if: always()
        run: docker compose down

  image-scan:
    name: Docker Image Scan (Trivy + Scout)
    runs-on: ubuntu-latest
    needs: build

    defaults:
      run:
        working-directory: Api

    steps:
      # IMPORTANT: no rebuild here — reuse image from build job context
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Installs Docker Scout as a plugin
      - name: Install Docker Scout
        run: |
          curl -sSfL https://raw.githubusercontent.com/docker/scout-cli/main/install.sh | sh

      # Login to Docker Hub using PAT
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Scan Docker image for known vulnerabilities (CVEs) using Docker Scout
      - name: Docker Scout CVE scan
        run: |
          IMAGE=arcadehaven-api:latest
          docker scout cves $IMAGE

      # Install Trivy
      - name: Install Trivy
        run: |
          sudo apt-get update
          sudo apt-get install -y wget
          wget -qO- https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo apt-key add -
          echo "deb https://aquasecurity.github.io/trivy-repo/deb generic main" | sudo tee -a /etc/apt/sources.list.d/trivy.list
          sudo apt-get update
          sudo apt-get install -y trivy

      # Run Trivy scan
      - name: Scan Docker image with Trivy
        run: |
          IMAGE=arcadehaven-api:latest
          trivy image --format json --output trivy-report.json $IMAGE

      # Upload Trivy report
      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: Api/trivy-report.json

  dast:
    name: DAST Scan - OWASP ZAP
    runs-on: ubuntu-latest
    needs: build

    defaults:
      run:
        working-directory: Api

    steps:
      # Restart containers
      - name: Start stack
        run: docker compose up -d

      # Application health check
      - name: Wait for app
        run: |
          for i in {1..60}; do
            if curl -fs http://localhost:8080/actuator/health; then
              echo "App ready"
              exit 0
            fi

            echo $i ": Waiting for app..."
            sleep 5
          done

          echo "App failed to start"
          docker compose logs

          exit 1

      - name: OWASP ZAP Scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: "http://localhost:8080"
          fail_action: false
          allow_issue_writing: false
          artifact_name: zap-report

      - name: Upload ZAP report
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: Api/target/report_html.html

      - name: Cleanup
        if: always()
        run: docker compose down