name: Build Docker Image

on:
  push:
    branches: [ main, pipeline ]

  pull_request:
    branches: [ main, pipeline ]

  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  docker-build:
    name: Build + Analyze Docker Image
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Api

    steps:
      # Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v5

      # Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Verify Docker Compose
      - name: Verify Docker Compose
        run: docker compose version

      # Build Docker image
      - name: Build Docker image with Compose
        run: docker compose build

      # Start containers (optional but kept as you had it)
      - name: Start containers
        run: docker compose up -d

      # Stop containers
      - name: Stop containers
        if: always()
        run: docker compose down

      # Install Trivy
      - name: Install Trivy
        run: |
          sudo apt-get update
          sudo apt-get install -y wget
          wget -qO- https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo apt-key add -
          echo "deb https://aquasecurity.github.io/trivy-repo/deb generic main" | sudo tee -a /etc/apt/sources.list.d/trivy.list
          sudo apt-get update
          sudo apt-get install -y trivy

      # Run Trivy scan
      - name: Scan Docker image with Trivy
        run: |
          IMAGE=arcadehaven-api:latest
          trivy image --format json --output trivy-report.json $IMAGE

      # Upload Trivy report
      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: Api/trivy-report.json