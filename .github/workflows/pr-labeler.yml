name: Copy Labels from Linked Issues to PR

on:
  pull_request:
    types: [opened, edited, synchronize]

permissions:
  contents: read
  pull-requests: write
  issues: read

jobs:
  copy-labels:
    name: Sync labels from linked issues
    runs-on: ubuntu-latest

    steps:
      - name: Copy labels from linked issues
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.pull_request.body || '';
            const prNumber = context.payload.pull_request.number;

            // Match "closes #123", "fixes #123", "resolves #123" (case-insensitive)
            const issueRefs = [...body.matchAll(/(?:closes?|fixes?|resolves?)\s+#(\d+)/gi)];

            if (issueRefs.length === 0) {
              console.log('No linked issues found in PR body.');
              return;
            }

            const labelSet = new Set();

            for (const match of issueRefs) {
              const issueNumber = parseInt(match[1]);
              try {
                const { data: issue } = await github.rest.issues.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber
                });
                issue.labels.forEach(l => labelSet.add(l.name));
                console.log(`Issue #${issueNumber} has labels: ${issue.labels.map(l => l.name).join(', ')}`);
              } catch (e) {
                console.log(`Could not fetch issue #${issueNumber}: ${e.message}`);
              }
            }

            if (labelSet.size === 0) {
              console.log('Linked issues have no labels to copy.');
              return;
            }

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              labels: [...labelSet]
            });

            console.log(`Applied labels to PR #${prNumber}: ${[...labelSet].join(', ')}`);
