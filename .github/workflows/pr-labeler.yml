name: Copy Labels from Linked Issues to PR

on:
  pull_request:
    types: [opened, edited, synchronize]

permissions:
  contents: read
  pull-requests: write
  issues: read

jobs:
  copy-labels:
    name: Sync labels from linked issues
    runs-on: ubuntu-latest

    steps:
      - name: Copy labels from linked issues
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const body = context.payload.pull_request.body || '';

            // Source 1: closing references via GraphQL (covers "closes #X" keywords + sidebar links)
            const query = `
              query($owner: String!, $repo: String!, $pr: Int!) {
                repository(owner: $owner, name: $repo) {
                  pullRequest(number: $pr) {
                    closingIssuesReferences(first: 25) {
                      nodes {
                        number
                        labels(first: 20) {
                          nodes { name }
                        }
                      }
                    }
                  }
                }
              }
            `;

            const result = await github.graphql(query, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pr: prNumber
            });

            const closingIssues = result.repository.pullRequest.closingIssuesReferences.nodes;

            // Source 2: any bare #number mention in the PR body (associate without closing)
            const mentionedNumbers = [...body.matchAll(/#(\d+)/g)].map(m => parseInt(m[1]));
            const closingNumbers = new Set(closingIssues.map(i => i.number));

            // Fetch labels for mentioned issues not already covered by closingIssuesReferences
            const mentionedIssues = [];
            for (const num of [...new Set(mentionedNumbers)]) {
              if (closingNumbers.has(num)) continue;
              try {
                const { data: issue } = await github.rest.issues.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: num
                });
                // Skip PRs (GitHub issues and PRs share the same number space)
                if (!issue.pull_request) mentionedIssues.push(issue);
              } catch (e) {
                console.log(`Could not fetch #${num}: ${e.message}`);
              }
            }

            const labelSet = new Set();

            for (const issue of closingIssues) {
              issue.labels.nodes.forEach(l => labelSet.add(l.name));
              console.log(`Closing issue #${issue.number} labels: ${issue.labels.nodes.map(l => l.name).join(', ')}`);
            }

            for (const issue of mentionedIssues) {
              issue.labels.forEach(l => labelSet.add(l.name));
              console.log(`Mentioned issue #${issue.number} labels: ${issue.labels.map(l => l.name).join(', ')}`);
            }

            if (labelSet.size === 0) {
              console.log('No labels found from linked or mentioned issues.');
              return;
            }

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              labels: [...labelSet]
            });

            console.log(`Applied labels to PR #${prNumber}: ${[...labelSet].join(', ')}`);
