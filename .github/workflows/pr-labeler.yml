name: Copy Labels from Linked Issues to PR

on:
  pull_request:
    types: [opened, edited, synchronize]

permissions:
  contents: read
  pull-requests: write
  issues: read

jobs:
  copy-labels:
    name: Sync labels from linked issues
    runs-on: ubuntu-latest

    steps:
      - name: Copy labels from linked issues
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request.number;

            // Use GraphQL to fetch issues linked via the GitHub "Development" sidebar
            // (closingIssuesReferences covers both sidebar links and "closes #X" in the body)
            const query = `
              query($owner: String!, $repo: String!, $pr: Int!) {
                repository(owner: $owner, name: $repo) {
                  pullRequest(number: $pr) {
                    closingIssuesReferences(first: 25) {
                      nodes {
                        number
                        labels(first: 20) {
                          nodes { name }
                        }
                      }
                    }
                  }
                }
              }
            `;

            const result = await github.graphql(query, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pr: prNumber
            });

            const linkedIssues = result.repository.pullRequest.closingIssuesReferences.nodes;

            if (linkedIssues.length === 0) {
              console.log('No linked issues found.');
              return;
            }

            const labelSet = new Set();
            for (const issue of linkedIssues) {
              issue.labels.nodes.forEach(l => labelSet.add(l.name));
              console.log(`Issue #${issue.number} labels: ${issue.labels.nodes.map(l => l.name).join(', ')}`);
            }

            if (labelSet.size === 0) {
              console.log('Linked issues have no labels to copy.');
              return;
            }

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              labels: [...labelSet]
            });

            console.log(`Applied labels to PR #${prNumber}: ${[...labelSet].join(', ')}`);
