name: Build API and Test

on:
  workflow_call:

  workflow_dispatch:

# Only allows github to read contents in repository
permissions:
  contents: read

jobs:
  build-test:
    name: Build and Test API
    runs-on: ubuntu-latest

    # Defines folder where pipeline runs commands
    defaults:
      run:
        working-directory: Api

    env:
      SPRING_DATASOURCE_URL: ${{ vars.SPRING_DATASOURCE_URL }}
      SPRING_DATASOURCE_USERNAME: ${{ secrets.SPRING_DATASOURCE_USERNAME }}
      SPRING_DATASOURCE_PASSWORD: ${{ secrets.SPRING_DATASOURCE_PASSWORD }}
      KEYCLOAK_JWK_SET_URI: ${{ vars.KEYCLOAK_JWK_SET_URI }}
      KEYCLOAK_JWK_ISSUER: ${{ vars.KEYCLOAK_JWK_ISSUER }}
      KEYCLOAK_SERVER_URL: ${{ vars.KEYCLOAK_SERVER_URL }}
      KEYCLOAK_REALM: ${{ secrets.KEYCLOAK_REALM }}
      KEYCLOAK_CLIENT_ID: ${{ vars.KEYCLOAK_CLIENT_ID }}
      KEYCLOAK_BACKEND_CLIENT_SECRET: ${{ secrets.KEYCLOAK_BACKEND_CLIENT_SECRET }}
      KEYCLOAK_ADMIN_USERNAME: ${{ secrets.KEYCLOAK_ADMIN_USERNAME }}
      KEYCLOAK_ADMIN_PASSWORD: ${{ secrets.KEYCLOAK_ADMIN_PASSWORD }}
      ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
      ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      SFTP_HOST: ${{ vars.SFTP_HOST }}
      SFTP_PORT: ${{ vars.SFTP_PORT }}
      SFTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
      SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
      SFTP_REMOTE_DIR: ${{ vars.SFTP_REMOTE_DIR }}
      KC_DB: ${{ vars.KC_DB }}
      KC_DB_URL: ${{ vars.KC_DB_URL }}
      KC_DB_USERNAME: ${{ secrets.POSTGRES_USER }}
      KC_DB_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      KC_HOSTNAME_STRICT: ${{ vars.KC_HOSTNAME_STRICT }}
      KC_HTTP_ENABLED: ${{ vars.KC_HTTP_ENABLED }}
      KC_HEALTH_ENABLED: ${{ vars.KC_HEALTH_ENABLED }}
      POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
      POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      CLAMAV_HOST: ${{ vars.CLAMAV_HOST }}
      CLAMAV_PORT: ${{ vars.CLAMAV_PORT }}
      CLAMAV_TIMEOUT_MS: ${{ vars.CLAMAV_TIMEOUT_MS }}

    steps:
      # Get code from repository
      - name: Checkout repository
        uses: actions/checkout@v5

      # Installs Java for GitHub Runner
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Gives execution permissions to Maven wrapper
      - name: Fix Maven wrapper permissions
        run: chmod +x ./mvnw

      # Create reports directory in workspace if it doesn't exist
      - name: Create reports directory
        run: mkdir -p reports/jacoco reports/sbom

      # Cleans, builds, tests and packages project
      - name: Package project
        run: ./mvnw -B clean package

      - name: Check JAR exists
        run: ls -lh target/*.jar

      # Logs a table of contents inside the jar (compile application)
      - name: Inspect JAR contents
        run: jar tf target/*.jar | head -n 50

      # Generate JaCoCo HTML coverage report (reads jacoco.exec produced by the test phase)
      - name: Generate JaCoCo coverage report
        run: ./mvnw -B jacoco:report
 
      - name: Move JaCoCo report into reports folder
        run: mv target/site/jacoco reports/jacoco || true

      # Lists all dependencies in the project and respective information
      - name: Generate SBOM
        run: ./mvnw -B cyclonedx:makeAggregateBom
 
      - name: Move SBOM into reports folder
        run: mv target/bom.* reports/sbom/ || true

      - name: Upload all reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-build-test
          path: Api/reports/