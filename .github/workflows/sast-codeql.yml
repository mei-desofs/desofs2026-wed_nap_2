name: SAST - CodeQL # Static Application Security Testing (SAST)

on:
  workflow_call:

  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  codeql:
    name: CodeQL Java Analysis
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Api

    steps:
      # Get code from repository
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Install Java for GitHub runner
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Cache SonarCloud packages to speed up future runs
      - name: Cache SonarCloud packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      # Create reports directory in workspace if it doesn't exist
      - name: Create reports directory
        run: mkdir -p reports/codeql-results

      # Start CodeQL analysis for Java
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java
          queries: security-extended,security-and-quality

      # Build project manually instead of using CodeQL autobuild
      - name: Build project for CodeQL
        run: ./mvnw -B clean compile -DskipTests

      # Runs security queries and uploads results to GitHub
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          output: Api/reports/codeql-results

      - name: Debug env
        run: |
          echo "DB URL: $SPRING_DATASOURCE_URL"
          docker compose config

      # Run SonarCloud analysis via Maven
      - name: SonarCloud Analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          ./mvnw -B verify sonar:sonar \
            -DskipTests \
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }} \
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }} \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.token=${{ secrets.SONAR_TOKEN }} \
            -Dsonar.scanner.metadataFilePath=reports/sonar-report.json

      # Upload all reports
      - name: Upload all reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-sast-codeql
          path: Api/reports/

      # Search