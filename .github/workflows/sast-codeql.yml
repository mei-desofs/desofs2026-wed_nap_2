name: SAST - CodeQL # Static Application Security Testing (SAST)

on:
  push:
    branches: [ main ]

  pull_request:
    branches: [ main ]

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  codeql:
    name: CodeQL Java Analysis
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Api

    steps:
      # Get code from repository
      - name: Checkout repository
        uses: actions/checkout@v5

      # Install Java for GitHub runner
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Start CodeQL analysis for Java
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java
          queries: security-extended,security-and-quality

      # Gives execution permissions to Maven wrapper
      - name: Fix Maven wrapper permissions
        run: chmod +x ./mvnw

      # Build project manually instead of using CodeQL autobuild
      - name: Build project for CodeQL
        run: ./mvnw -B clean compile -DskipTests

      # Runs security queries and uploads results to GitHub
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4